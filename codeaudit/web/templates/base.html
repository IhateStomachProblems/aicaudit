<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAudit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            codeaudit: { 50: "#eef2ff", 100: "#e0e7ff", 200: "#c7d2fe", 300: "#a5b4fc",
              400: "#818cf8", 500: "#6366f1", 600: "#4f46e5", 700: "#4338ca",
              800: "#3730a3", 900: "#312e81", 950: "#1e1b4b" }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .finding-enter { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .scan-progress { transition: width 0.3s ease; }
    .severity-critical { border-left: 3px solid #ef4444; }
    .severity-error { border-left: 3px solid #f97316; }
    .severity-warning { border-left: 3px solid #eab308; }
    .severity-info { border-left: 3px solid #3b82f6; }
    .sidebar-link { @apply flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-colors; }
    .sidebar-link:hover { @apply bg-codeaudit-700/50; }
    .sidebar-link.active { @apply bg-codeaudit-600 text-white; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex">
  <!-- Sidebar -->
  <nav class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
    <div class="p-4 border-b border-gray-800">
      <a href="/" class="flex items-center gap-2">
        <span class="text-xl font-bold bg-gradient-to-r from-codeaudit-400 to-purple-400 bg-clip-text text-transparent">CodeAudit</span>
      </a>
      <span class="text-xs text-gray-500 mt-1 block">v0.1.0 · AI code audit</span>
    </div>
    <div class="flex-1 p-3 space-y-1">
      <a href="/" class="sidebar-link" :class="{ active: path === '/' }" x-data="{ path: window.location.pathname }">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/scan" class="sidebar-link" :class="{ active: path === '/scan' }" x-data="{ path: window.location.pathname }">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Scan
      </a>
      <a href="/rules" class="sidebar-link" :class="{ active: path === '/rules' }" x-data="{ path: window.location.pathname }">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        Rules
      </a>
      <a href="/config" class="sidebar-link" :class="{ active: path === '/config' }" x-data="{ path: window.location.pathname }">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Config
      </a>
    </div>
    <div class="p-3 border-t border-gray-800 text-xs text-gray-600">
      <a href="https://github.com/IhateStomachProblems/codeaudit" target="_blank" class="hover:text-gray-400">GitHub</a>
      <span class="mx-1">·</span>
      <a href="/docs" target="_blank" class="hover:text-gray-400">API</a>
    </div>
  </nav>

  <!-- Main content -->
  <main class="flex-1 overflow-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
