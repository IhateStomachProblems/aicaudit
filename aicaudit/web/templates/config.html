{% extends "base.html" %}
{% block content %}
<div class="p-6 max-w-3xl" x-data="configApp()">
  <h1 class="text-2xl font-bold mb-6">Configuration</h1>

  <div class="space-y-4">
    <!-- AI Provider -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
      <h3 class="text-sm font-medium mb-4">AI Provider</h3>
      <div class="grid grid-cols-5 gap-2">
        <template x-for="p in providers" :key="p.id">
          <button @click="provider = p.id"
            class="px-3 py-2 rounded-lg text-sm border transition text-center"
            :class="provider === p.id ? 'bg-aicaudit-600/20 border-aicaudit-500 text-aicaudit-400' : 'bg-gray-950 border-gray-700 text-gray-400 hover:border-gray-600'">
            <span x-text="p.label"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- API Config -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
      <h3 class="text-sm font-medium mb-4">API Settings</h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-gray-400 block mb-1">API Key</label>
          <input type="password" x-model="apiKey" placeholder="sk-..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-aicaudit-500 outline-none">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Base URL</label>
          <input type="text" x-model="apiBase" placeholder="https://api.openai.com/v1" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-aicaudit-500 outline-none">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Model</label>
          <input type="text" x-model="model" placeholder="gpt-4o-mini" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-aicaudit-500 outline-none">
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-3">Supports OpenAI, Claude, Ollama, and any OpenAI-compatible relay service.</p>
    </div>

    <!-- Save -->
    <div class="flex items-center gap-3">
      <button @click="saveConfig()" class="bg-aicaudit-600 hover:bg-aicaudit-500 px-5 py-2 rounded-lg text-sm font-medium transition">Save</button>
      <span x-show="saved" class="text-emerald-400 text-sm">Configuration saved</span>
    </div>
  </div>
</div>

<script>
function configApp() {
  return {
    providers: [
      { id: "relay", label: "Relay" },
      { id: "openai", label: "OpenAI" },
      { id: "claude", label: "Claude" },
      { id: "ollama", label: "Ollama" },
      { id: "mock", label: "Offline" },
    ],
    provider: "{{ ai_cfg.provider }}",
    apiKey: "",
    apiBase: "{{ ai_cfg.api_base }}",
    model: "{{ ai_cfg.model }}",
    saved: false,

    async saveConfig() {
      const resp = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ai_provider: this.provider,
          ai_key: this.apiKey,
          ai_base: this.apiBase,
          ai_model: this.model,
        }),
      });
      this.saved = true;
      setTimeout(() => this.saved = false, 2000);
    }
  }
}
</script>
{% endblock %}
