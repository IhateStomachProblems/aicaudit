{% extends "base.html" %}
{% block title %}Results · AICAudit{% endblock %}
{% block page %}results{% endblock %}
{% block content %}
  <div id="results-root" data-session="{{ session_id }}">
    <h1 class="page-title">Results</h1>
    <p class="page-sub">Session <span class="mono">{{ session_id }}</span></p>

    <div class="grid cols-6" id="sum"><div class="card"><span class="spinner"></span></div></div>

    <div class="filter-bar mt">
      <select class="input" id="f-sev">
        <option value="">all severities</option>
        <option value="critical">critical</option>
        <option value="error">error</option>
        <option value="warning">warning</option>
        <option value="info">info</option>
      </select>
      <select class="input" id="f-rule"><option value="">all rules</option></select>
      <input class="input search" id="f-search" placeholder="Search message, file, rule…">
      <span class="small muted mono" id="count"></span>
      <span style="margin-left:auto;display:flex;gap:8px">
        <button class="btn sm" id="export-json">Export JSON</button>
        <button class="btn sm" id="export-sarif">Export SARIF</button>
        <button class="btn sm primary" id="verify-btn">Verify with AI</button>
      </span>
    </div>

    <div class="results-layout">
      <div id="findings"><div class="empty"><span class="spinner"></span></div></div>
      <div class="card" id="detail"><div class="empty">Select a finding to inspect its code context, taint path, AI verdict, and fix.</div></div>
    </div>
  </div>
{% endblock %}
