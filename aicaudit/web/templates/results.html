{% extends "base.html" %}
{% block content %}
<div class="p-6 max-w-6xl" x-data="resultsApp()" x-init="loadResults()">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Scan Results</h1>
      <p class="text-gray-500 text-sm mt-1" x-text="summary"></p>
    </div>
    <div class="flex gap-2">
      <button @click="exportJSON()" class="bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-lg text-sm transition">JSON</button>
      <button @click="exportSARIF()" class="bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-lg text-sm transition">SARIF</button>
      <button @click="runAI()" :disabled="aiRunning" class="bg-purple-600 hover:bg-purple-500 disabled:bg-gray-700 px-3 py-2 rounded-lg text-sm transition" x-text="aiRunning ? 'Verifying...' : 'AI Verify'"></button>
    </div>
  </div>

  <!-- Severity summary -->
  <div class="grid grid-cols-5 gap-3 mb-6">
    <div class="bg-red-500/10 border border-red-500/20 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-red-400" x-text="counts.critical || 0"></div>
      <div class="text-xs text-red-400/70 mt-1">Critical</div>
    </div>
    <div class="bg-orange-500/10 border border-orange-500/20 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-orange-400" x-text="counts.error || 0"></div>
      <div class="text-xs text-orange-400/70 mt-1">Error</div>
    </div>
    <div class="bg-yellow-500/10 border border-yellow-500/20 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-yellow-400" x-text="counts.warning || 0"></div>
      <div class="text-xs text-yellow-400/70 mt-1">Warning</div>
    </div>
    <div class="bg-blue-500/10 border border-blue-500/20 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-blue-400" x-text="counts.info || 0"></div>
      <div class="text-xs text-blue-400/70 mt-1">Info</div>
    </div>
    <div class="bg-gray-800/50 border border-gray-700 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-gray-300" x-text="findings.length"></div>
      <div class="text-xs text-gray-500 mt-1">Total</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="flex gap-3 mb-4">
    <select x-model="severityFilter" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs">
      <option value="">All Severities</option>
      <option value="critical">Critical</option>
      <option value="error">Error</option>
      <option value="warning">Warning</option>
      <option value="info">Info</option>
    </select>
    <select x-model="ruleFilter" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs">
      <option value="">All Rules</option>
      <template x-for="rid in ruleIds" :key="rid">
        <option :value="rid" x-text="rid"></option>
      </template>
    </select>
    <input type="text" x-model="searchText" placeholder="Search findings..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs focus:border-aicaudit-500 outline-none">
  </div>

  <!-- Findings list -->
  <div class="space-y-3">
    <template x-for="f in filteredFindings" :key="f.file + ':' + f.line">
      <div class="finding-enter bg-gray-900 border border-gray-800 rounded-xl p-4" :class="'severity-' + f.severity">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-mono text-xs text-aicaudit-400 px-1.5 py-0.5 bg-aicaudit-500/10 rounded" x-text="f.rule_id"></span>
              <span class="text-xs px-1.5 py-0.5 rounded-full" :class="{
                'bg-red-500/10 text-red-400': f.severity === 'critical',
                'bg-orange-500/10 text-orange-400': f.severity === 'error',
                'bg-yellow-500/10 text-yellow-400': f.severity === 'warning',
                'bg-blue-500/10 text-blue-400': f.severity === 'info',
              }" x-text="f.severity.toUpperCase()"></span>
              <template x-if="f.ai_verified !== undefined">
                <span class="text-xs px-1.5 py-0.5 rounded-full"
                  :class="f.ai_verified ? 'bg-green-500/10 text-green-400' : 'bg-gray-700 text-gray-300'"
                  x-text="f.ai_verified ? 'AI: confirmed' : 'AI: false positive'"></span>
              </template>
            </div>
            <p class="text-sm text-gray-200 mb-1" x-text="f.message"></p>
            <p class="font-mono text-xs text-gray-500">
              <span class="text-aicaudit-400" x-text="f.file"></span>:<span x-text="f.line"></span>
            </p>
            <template x-if="f.snippet">
              <pre class="mt-2 bg-gray-950 rounded-lg p-2 font-mono text-xs text-gray-400 overflow-x-auto" x-text="f.snippet"></pre>
            </template>
            <template x-if="f.ai_reason">
              <div class="mt-2 text-xs text-purple-300/80">
                <span class="font-medium">AI:</span> <span x-text="f.ai_reason"></span>
              </div>
            </template>
          </div>
          <div class="flex flex-col items-end gap-1 shrink-0">
            <template x-if="f.fix">
              <button @click="applyFix(f)" class="text-xs bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 px-2 py-1 rounded transition">Apply Fix</button>
            </template>
          </div>
        </div>
      </div>
    </template>
    <div x-show="filteredFindings.length === 0" class="text-center py-12 text-gray-500">
      <p class="text-lg mb-1">No findings</p>
      <p class="text-sm">Try adjusting the filters or running a new scan</p>
    </div>
  </div>
</div>

<script>
function resultsApp() {
  return {
    sessionId: "{{ session_id }}",
    session: null,
    findings: [],
    severityFilter: "",
    ruleFilter: "",
    searchText: "",
    aiRunning: false,

    get summary() {
      if (!this.session) return "";
      return `${this.session.total} findings · ${this.session.duration}s · ${this.session.files_scanned} files`;
    },

    get counts() {
      const c = {};
      for (const f of this.findings) c[f.severity] = (c[f.severity] || 0) + 1;
      return c;
    },

    get ruleIds() {
      return [...new Set(this.findings.map(f => f.rule_id))].sort();
    },

    get filteredFindings() {
      let result = this.findings;
      if (this.severityFilter) result = result.filter(f => f.severity === this.severityFilter);
      if (this.ruleFilter) result = result.filter(f => f.rule_id === this.ruleFilter);
      if (this.searchText) {
        const q = this.searchText.toLowerCase();
        result = result.filter(f =>
          (f.message || "").toLowerCase().includes(q) ||
          (f.file || "").toLowerCase().includes(q));
      }
      return result;
    },

    async loadResults() {
      try {
        const resp = await fetch(`/api/results/${this.sessionId}`);
        this.session = await resp.json();
        this.findings = this.session.findings || [];
      } catch (e) {
        console.error("Failed to load results:", e);
      }
    },

    async runAI() {
      this.aiRunning = true;
      try {
        const resp = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: this.sessionId }),
        });
        const data = await resp.json();
        if (data.error) {
          alert(data.error);
        } else {
          await this.loadResults();
        }
      } catch (e) {
        alert("AI verification failed: " + e);
      } finally {
        this.aiRunning = false;
      }
    },

    async applyFix(f) {
      try {
        const resp = await fetch("/api/apply-fix", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            file: f.file, rule_id: f.rule_id, line: f.line, fix: f.fix,
          }),
        });
        const data = await resp.json();
        if (data.ok) {
          alert("Fix applied (backup: " + (data.backup || "n/a") + ")");
        } else {
          alert("Failed to apply fix");
        }
      } catch (e) {
        alert("Failed to apply fix: " + e);
      }
    },

    async exportJSON() {
      const resp = await fetch("/api/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: this.sessionId, format: "json" }),
      });
      const data = await resp.json();
      this.download("aicaudit-report.json", JSON.stringify(data, null, 2));
    },

    async exportSARIF() {
      const resp = await fetch("/api/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: this.sessionId, format: "sarif" }),
      });
      const data = await resp.json();
      this.download("aicaudit.sarif", JSON.stringify(data, null, 2));
    },

    download(filename, content) {
      const blob = new Blob([content], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  }
}
</script>
{% endblock %}
