<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AICAudit{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="{% block page %}{% endblock %}">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="brand">AICAudit</div>
        <div class="ver">v0.2.0 · evidence-driven AI audit</div>
      </div>
      <nav class="sidebar-nav">
        <a href="/" data-nav="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
          Dashboard
        </a>
        <a href="/scan" data-nav="scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
          Scan
        </a>
        <a href="/rules" data-nav="rules">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6-2a11.94 11.94 0 01-3.62 8.56L12 21l-5.38-4.44A11.94 11.94 0 013 9V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          Rules
        </a>
        <a href="/config" data-nav="config">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          AI Config
        </a>
      </nav>
      <div class="sidebar-foot">
        <a href="https://github.com/IhateStomachProblems/aicaudit" target="_blank">GitHub ↗</a>
        <a href="/docs" target="_blank">API docs ↗</a>
      </div>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/app.js"></script>
  <script>
    (function () {
      var page = document.body.dataset.page;
      var link = document.querySelector('[data-nav="' + page + '"]');
      if (link) link.classList.add("active");
    })();
  </script>
</body>
</html>
