[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicaudit"
version = "0.3.0"
description = "AI-powered code audit CLI for Python projects. Static analysis + AI verification with evidence chains."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "IhateStomachProblems" }]
keywords = ["code-audit", "security", "static-analysis", "code-quality", "ai", "vulnerability-scanning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version<'3.11'",
    "anthropic>=0.40.0",
    # security floors — versions below these have known CVEs:
    #   jinja2 <3.1.5: CVE-2024-56201 / CVE-2024-56326 (sandbox breakout)
    #   starlette <1.0.1: CVE-2026-48710 "BadHost" (host-header auth bypass);
    #                     CVE-2026-54283 (DoS, affects <=1.3.1)
    "fastapi>=0.161.0",
    "starlette>=1.4.0; python_version<'3.11'",
    "starlette>=1.9.0; python_version>='3.11'",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.5",
    "pygments>=2.16",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/IhateStomachProblems/aicaudit"
Repository = "https://github.com/IhateStomachProblems/aicaudit"
Documentation = "https://github.com/IhateStomachProblems/aicaudit"

[project.scripts]
aicaudit = "aicaudit.cli:main"

[tool.setuptools]
packages = [
    "aicaudit",
    "aicaudit.llm",
    "aicaudit.rules",
    "aicaudit.rules.security",
    "aicaudit.rules.quality",
    "aicaudit.rules.performance",
    "aicaudit.output",
    "aicaudit.web",
]

[tool.setuptools.package-data]
aicaudit = ["web/templates/*.html", "web/static/*"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["ALL"]
