[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaudit"
version = "0.1.0"
description = "AI-powered code audit CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["click>=8.0"]

[project.scripts]
codeaudit = "codeaudit.cli:main"
