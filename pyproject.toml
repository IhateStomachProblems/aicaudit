[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicaudit"
version = "0.1.0"
description = "AI-powered code audit CLI for Python projects. Static analysis + AI verification with evidence chains."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "IhateStomachProblems" }]
keywords = ["code-audit", "security", "static-analysis", "code-quality", "ai", "vulnerability-scanning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version<'3.11'",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://github.com/IhateStomachProblems/aicaudit"
Repository = "https://github.com/IhateStomachProblems/aicaudit"
Documentation = "https://github.com/IhateStomachProblems/aicaudit"

[project.scripts]
aicaudit = "aicaudit.cli:main"

[tool.setuptools]
packages = [
    "aicaudit",
    "aicaudit.llm",
    "aicaudit.rules",
    "aicaudit.rules.security",
    "aicaudit.rules.quality",
    "aicaudit.rules.performance",
    "aicaudit.output",
    "aicaudit.web",
]

[tool.setuptools.package-data]
aicaudit = ["web/templates/*.html"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["ALL"]
