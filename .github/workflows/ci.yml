name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
          pip install pytest pytest-cov ruff mypy pyyaml

      - name: Ruff lint
        run: ruff check aicaudit tests

      - name: Mypy type check
        run: mypy aicaudit --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=aicaudit --cov-report=term
          pytest tests/ --cov=aicaudit --cov-fail-under=90 --cov-report=term

      - name: Self-scan
        run: aicaudit scan aicaudit/

  supply-chain:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit the resolved dependency tree
        run: |
          python -m venv .audit-env
          .audit-env/bin/pip install --quiet --upgrade pip
          .audit-env/bin/pip install --quiet ".[mcp]"
          .audit-env/bin/pip install --quiet pip-audit
          .audit-env/bin/python -m pip_audit

