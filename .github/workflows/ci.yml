name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff mypy

      - name: Ruff lint
        run: ruff check aicaudit tests

      - name: Mypy type check
        run: mypy aicaudit --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=aicaudit --cov-report=term
          pytest tests/ --cov=aicaudit --cov-fail-under=90 --cov-report=term

      - name: Self-scan
        run: aicaudit scan aicaudit/
