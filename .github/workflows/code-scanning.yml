name: AICAudit Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"   # daily scan

jobs:
  aicaudit-scan:
    name: AICAudit SARIF scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AICAudit
        run: |
          pip install --upgrade pip
          pip install -e .  # switch to `pip install aicaudit` once published on PyPI

      - name: Run AICAudit scan
        run: aicaudit scan . --output sarif > aicaudit.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aicaudit.sarif
