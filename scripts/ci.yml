# GitHub Actions workflow template
# Copy to .github/workflows/ci.yml to activate (requires workflow scope).

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov ruff mypy
      - name: Ruff lint
        run: ruff check codeaudit tests
      - name: Mypy type check
        run: mypy codeaudit --ignore-missing-imports
      - name: Run tests
        run: pytest tests/ --cov=codeaudit --cov-report=term
      - name: Self-scan
        run: codeaudit scan codeaudit/
